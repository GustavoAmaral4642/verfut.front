<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core">

<h:head>
    <h:outputStylesheet name="primefaces-nova-dark/theme.css"/>
</h:head>

<h:body>

    <div class="card">
        <h:form>
            <p:growl id="messages"/>
            <p:menubar hideDelay="1000">
                <p:submenu label="Arquivo" icon="pi pi-fw pi-file" disabled="true">
                    <p:submenu label="New" icon="pi pi-fw pi-plus" >
                        <p:menuitem value="Bookmark" icon="pi pi-fw pi-bookmark"/>
                        <p:menuitem value="Video" icon="pi pi-fw pi-video"/>
                    </p:submenu>
                    <p:menuitem value="Delete" icon="pi pi-fw pi-trash"/>
                    <p:divider/>
                    <p:menuitem value="Export" icon="pi pi-fw pi-external-link"/>
                    <p:menuitem value="Duplicate" icon="pi pi-fw pi-copy" disabled="true"/>
                </p:submenu>

                <p:submenu label="Configurações" icon="pi pi-fw pi-file" disabled="true">
                    <p:submenu label="New" icon="pi pi-fw pi-plus">
                        <p:menuitem value="Bookmark" icon="pi pi-fw pi-bookmark"/>
                        <p:menuitem value="Video" icon="pi pi-fw pi-video"/>
                    </p:submenu>
                    <p:menuitem value="Delete" icon="pi pi-fw pi-trash"/>
                    <p:divider/>
                    <p:menuitem value="Export" icon="pi pi-fw pi-external-link"/>
                    <p:menuitem value="Duplicate" icon="pi pi-fw pi-copy" disabled="true"/>
                </p:submenu>
            </p:menubar>

        </h:form>
    </div>

    <p:separator/>

    <div class="card">
        <h:form>
            <p:dataTable var="game" value="#{gameController.getGames()}">
                <f:facet name="header">
                    Jogos
                </f:facet>

                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="2" headerText="Data / Rodada"/>
                        <p:column colspan="3" headerText="Jogos" style="text-align: center"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Hora"/>
                        <p:column headerText="Time A"/>
                        <p:column headerText="Time B"/>
                    </p:row>
                </p:columnGroup>

                <p:subTable var="itemGameModel" value="#{game.itensGames}">
                    <f:facet name="header">
                        <h:outputText value="#{game.dateGame} / #{game.numberRound}"/>
                    </f:facet>

                    <p:column style="#{itemGameModel.hourGame == '15:30'  ? 'background-color: gainsboro;' : 'background-color: darkgrey;'};">
                    </p:column>
                    <p:column style="#{itemGameModel.hourGame == '15:30'  ? 'background-color: gainsboro;' : 'background-color: darkgrey;'} text-align:center; ">
                        <h:outputText value="Hora: #{itemGameModel.hourGame}"/>
                    </p:column>
                    <p:column style="#{itemGameModel.hourGame == '15:30'  ? 'background-color: gainsboro;' : 'background-color: darkgrey;'} text-align:right; ;">
                        <h:outputText value="#{itemGameModel.teamA}"/>
                        <h:outputText style="font-size: 12px; color: red; font-weight: bold" value=" [ #{itemGameModel.pointsReceivedTeamA} ] "/>
                        <h:outputText style="font-size: 15px; color: red; font-weight: bold" value="#{itemGameModel.totalGoalsTeamA}"/>
                    </p:column>
                    <p:column style="#{itemGameModel.hourGame == '15:30'  ? 'background-color: gainsboro;' : 'background-color: darkgrey;'};">
                        <h:outputText style="font-size: 15px; color: red; font-weight: bold"  value=" #{itemGameModel.totalGoalsTeamB} "/>
                        <h:outputText style="font-size: 12px; color: red; font-weight: bold"  value=" [ #{itemGameModel.pointsReceivedTeamB} ] "/>
                        <h:outputText value="#{itemGameModel.teamB}"/>
                    </p:column>

                    <p:columnGroup type="footer">
                        <p:row >
                            <p:column colspan="1" footerText="FOLGAS DA RODADA" class="font-bold" style="background: gainsboro; color: red"/>
                            <p:column colspan="3" footerText="#{game.noGames}" class="font-bold" style="background: gainsboro; color: red"/>
                        </p:row>
                    </p:columnGroup>
                </p:subTable>

            </p:dataTable>
        </h:form>
    </div>
</h:body>

</html>
